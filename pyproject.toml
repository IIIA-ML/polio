[project]
name = "polio"
version = "0.1.0"
description = "Detection of coordinated inauthentic behavior through synchronous repeated actions analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=2.3.0",
    "matplotlib>=3.3.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "scipy>=1.10.1",
    "scikit-learn>=1.7.2",
    "pyarrow>=22.0.0",
    "mpmath>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/approaches", "src/analysis", "src/baselines", "src/data_loader.py", "src/extractors.py"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905", "UP015", "UP017"]

[tool.ruff.lint.isort]
known-first-party = ["analysis", "approaches", "baselines", "data_loader", "extractors"]
